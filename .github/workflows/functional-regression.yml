name: Functional regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing smoke checks
        run: node scripts/smoke-check.mjs
      - name: Functional regression checks
        run: node scripts/functional-regression.mjs
