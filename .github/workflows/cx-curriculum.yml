name: CX curriculum checks
on:
  pull_request:
    branches: [main, fix/learner-functional-regressions]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/smoke-check.mjs
      - run: node scripts/cx-curriculum-check.mjs
