# AglaStep is a static HTML/JS application, not a Jekyll site.
# Disabled to prevent competing GitHub Pages deployments.
# The supported deployment workflow is .github/workflows/deploy.yml.
name: Legacy Jekyll deployment (disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy Jekyll deployment disabled. Use Deploy AglaStep to GitHub Pages."
