name: Site quality checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing smoke tests
        run: node scripts/smoke-check.mjs
      - name: Additional static quality checks
        run: node scripts/quality-check.mjs
